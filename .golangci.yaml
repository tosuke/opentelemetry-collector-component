# Configuration file for golangci-lint version 2
# For more options, refer to https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true

formatters:
  enable:
    - gofmt
    - goimports
    - golines
